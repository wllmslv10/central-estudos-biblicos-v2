name: PR29 - laboratorio isolado
on:
  push:
    branches: ['work/ceb-gestao-alunos-cartoes-telefone-20261106']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          VITE_CEB_LABORATORY: 'true'
          VITE_CEB_API_BASE: https://ceb-biblioteca-api-validacao.wllmslv10.workers.dev
      - run: node --test test/*.test.mjs
      - name: Deploy preview statico isolado (sem banco e sem alterar Worker existente)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.pr29.toml
      - name: Confirmar URL do preview
        run: curl --fail --retry 6 --retry-delay 4 https://ceb-pr29-testes.wllmslv10.workers.dev/
