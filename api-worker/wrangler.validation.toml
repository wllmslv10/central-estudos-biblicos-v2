name = "ceb-biblioteca-api-validacao"
main = "validation-worker.js"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = []

# No production Hyperdrive binding. Secrets belong only in this NEW Worker.
[vars]
CEB_RUNTIME = "validation"
CEB_STORAGE_PROVIDER = "neon"
CEB_STORAGE_ENDPOINT = "https://br-holy-lake-b5wmosos.storage.c-7.us-east-2.aws.neon.tech"
# Only synthetic test accounts may upload (enforced in materials.js).
CEB_UPLOADS_ENABLED = "true"

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[observability]
enabled = true
[observability.traces]
enabled = true
