name = "ceb-biblioteca-api"
main = "worker.js"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "48d8b2d8d2a048a1a90219030f4b9329"


[vars]
# Remain fail-closed until Free-plan status and recovery prerequisites are verified.
CEB_AI_FREE_CONFIRMED = "false"
CEB_WRITE_MODE = "read_only"
CEB_STORAGE_PROVIDER = "neon"
CEB_UPLOADS_ENABLED = "false"
CEB_STORAGE_ENDPOINT = "https://br-holy-lake-b5wmosos.storage.c-7.us-east-2.aws.neon.tech"
# CEB_STORAGE_ACCESS_KEY_ID and CEB_STORAGE_SECRET_ACCESS_KEY must be Worker secrets.
# Never publish secret values. No R2 binding/subscription is used by this config.

[ai]
binding = "AI"
