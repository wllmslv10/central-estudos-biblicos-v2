name: Deploy CEB to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate CEB frontend"]
    types: [completed]
    branches: [feature/sincronizacao-nuvem-ceb]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Checkout development version for isolated preview
        uses: actions/checkout@v4
        with:
          ref: feature/sincronizacao-nuvem-ceb
          path: preview-src
      - name: Build development version under /preview/
        working-directory: preview-src
        run: |
          npm install
          npm run build -- --base=/central-estudos-biblicos-v2/preview/
          mkdir -p ../dist/preview
          cp -R dist/. ../dist/preview/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4