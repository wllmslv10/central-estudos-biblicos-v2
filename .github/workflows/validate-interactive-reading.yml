name: Validate interactive reading and new slides
on:
  push:
    branches: ['work/ceb-auditoria-leitura-20261105']
  pull_request:
    paths: ['src/**', 'test/**', 'api-worker/**', 'scripts/test-interactive-reading-browser.mjs', '.github/workflows/validate-interactive-reading.yml']
permissions:
  contents: read
jobs:
  isolated-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix api-worker
      - run: node scripts/check-visual-identity.mjs
      - run: node --test test/*.test.mjs
      - run: npm test --prefix api-worker
      - run: npm run build
      # Stable test browser; the repository's future browser download is unavailable.
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-interactive-reading-browser.mjs
      - run: node scripts/test-originals-ui.mjs
      - name: Verificar texto bíblico real (Mateus 4:1-11)
        run: |
          node --input-type=module -e '
            const url = "https://api.midvash.com/v1/passages?refs=" + encodeURIComponent("Mateus 4:1-11") + "&version=almeida-livre";
            const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
            if (!response.ok) throw new Error(`API bíblica HTTP ${response.status}`);
            const payload = await response.json();
            const item = Array.isArray(payload.data) ? payload.data[0] : payload.data;
            if (!item?.text || typeof item.text !== "string" || item.text.length < 50) throw new Error("API bíblica não retornou o texto esperado");
            console.log(`Consulta real validada: ${item.text.length} caracteres`);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ceb-interactive-reading-validation
          path: interactive-reading-validation/
          retention-days: 14
