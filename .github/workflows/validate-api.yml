name: Validate CEB API

on:
  push:
    branches:
      - feature/sincronizacao-nuvem-ceb
  pull_request:
    branches:
      - main
      - feature/sincronizacao-nuvem-ceb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm install --no-package-lock
        working-directory: api-worker
      - name: Run API tests
        run: npm test
        working-directory: api-worker
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/ceb-worker-dry-run
        working-directory: api-worker
