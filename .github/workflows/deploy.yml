name: Retire legacy CEB GitHub Pages and redirect to official Cloudflare

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect-only legacy site
        run: |
          mkdir -p dist/preview
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0;url=https://ceb.ibne.workers.dev/">
          <title>CEB mudou para o endereço oficial</title>
          <link rel="canonical" href="https://ceb.ibne.workers.dev/"></head>
          <body><p>A Central de Estudos Bíblicos está disponível exclusivamente no
          <a href="https://ceb.ibne.workers.dev/">endereço oficial da CEB IBNE</a>.</p>
          <script>location.replace('https://ceb.ibne.workers.dev/');</script></body></html>
          HTML
          cp dist/index.html dist/instalar.html
          cp dist/index.html dist/preview/index.html
          cat > dist/sw.js <<'JS'
          self.addEventListener('install', event => { self.skipWaiting(); });
          self.addEventListener('activate', event => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
              await self.registration.unregister();
              await self.clients.claim();
              const clients = await self.clients.matchAll({type:'window',includeUncontrolled:true});
              for (const client of clients) client.navigate('https://ceb.ibne.workers.dev/');
            })());
          });
          self.addEventListener('fetch', event => {
            if (event.request.mode === 'navigate') event.respondWith(Response.redirect('https://ceb.ibne.workers.dev/', 302));
          });
          JS
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: https://wllmslv10.github.io/central-estudos-biblicos-v2/
    runs-on: ubuntu-latest
    needs: redirect
    steps:
      - name: Deploy redirect-only site
        uses: actions/deploy-pages@v4
