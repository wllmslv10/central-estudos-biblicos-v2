name: Validate library interface
on:
  push:
    branches: ['work/ceb-biblioteca-etapa1-20261027']
  pull_request:
    paths: ['src/App.tsx','src/LibraryPresentation.tsx','src/styles.css','scripts/test-library-ui.mjs','.github/workflows/validate-library-ui.yml']
permissions:
  contents: read
jobs:
  library-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/check-visual-identity.mjs
      - run: npm run test:presentation
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-library-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-interface-validation-${{ github.run_id }}
          path: library-ui-validation/
          retention-days: 7
