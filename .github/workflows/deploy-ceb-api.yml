name: Deploy CEB API to Cloudflare

# Deploy is intentionally manual while authentication is under development.
# This prevents commits on the feature branch from changing the live Worker.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify Cloudflare account ID
        shell: bash
        run: |
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "22577f2a4fba3b700b0d6595d556cdae" ]; then
            echo "Cloudflare account ID matches the account containing ceb-biblioteca-api."
          else
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not match the account containing ceb-biblioteca-api."
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Cloudflare token authentication
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
