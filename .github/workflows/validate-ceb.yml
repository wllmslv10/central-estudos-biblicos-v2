name: Validate CEB frontend

on:
  push:
    branches:
      - feature/sincronizacao-nuvem-ceb
  pull_request:
    branches:
      - main
      - feature/sincronizacao-nuvem-ceb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check and build frontend
        run: npm run build
