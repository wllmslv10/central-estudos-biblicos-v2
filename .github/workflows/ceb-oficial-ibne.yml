name: CEB oficial IBNE

on:
  push:
    branches: [work/ceb-oficial-ibne, deploy/ceb-oficial-ibne]

permissions:
  contents: read

concurrency:
  group: ceb-oficial-ibne-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_CEB_API_BASE: https://ceb.ibne.workers.dev
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    if: github.repository == 'wllmslv10/central-estudos-biblicos-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: api-worker
      - run: npm run build
      - run: node --test test/*.test.mjs
      - run: node scripts/check-visual-identity.mjs
      - run: npm test
        working-directory: api-worker
      - run: npx --no-install wrangler deploy --config wrangler.official.toml --dry-run --outdir "$RUNNER_TEMP/ceb-official-worker"
        working-directory: api-worker

  deploy:
    if: github.repository == 'wllmslv10/central-estudos-biblicos-v2' && github.ref == 'refs/heads/deploy/ceb-oficial-ibne' && vars.CEB_OFFICIAL_CI_ENABLED == 'true'
    needs: validate
    environment: ibne-ceb-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: api-worker
      - run: npm run build
      - name: Publicar e verificar somente o Worker ceb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CEB_IBNE_WORKERS_TOKEN }}
        run: bash ops/publish-ceb-official.sh
